<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="cubeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="topGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818CF8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Cube faces -->
  <!-- Left face -->
  <polygon points="32,64 32,96 64,112 64,80" fill="url(#cubeGradient)" opacity="0.9"/>

  <!-- Right face -->
  <polygon points="64,80 64,112 96,96 96,64" fill="#6366F1" opacity="0.7"/>

  <!-- Top face -->
  <polygon points="32,64 64,48 96,64 64,80" fill="url(#topGradient)" opacity="1"/>

  <!-- Code bracket symbol -->
  <g transform="translate(64, 64)">
    <!-- Left bracket -->
    <path d="M -12 -8 L -16 -8 L -16 8 L -12 8" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Right bracket -->
    <path d="M 12 -8 L 16 -8 L 16 8 L 12 8" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Center slash -->
    <line x1="-2" y1="-6" x2="2" y2="6" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>